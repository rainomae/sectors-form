server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # index.html is revalidated on every load, so a new deployment never points at assets that no longer exist.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
